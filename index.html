<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">A personal archive</p>
        <h1>Stargazers log</h1>
        <p class="intro">A log of the repositories I've starred.</p>
      </header>
      <section aria-labelledby="repositories-heading">
        <div class="section-heading">
          <h2 id="repositories-heading">Starred repositories</h2>
          <span class="section-mark" aria-hidden="true">&#9733;</span>
        </div>
        <ul class="repo-list" id="repo-list" aria-live="polite" aria-busy="true">
          <li class="list-message">Loading repositories...</li>
        </ul>
      </section>
    </main>
  </body>
</html>
